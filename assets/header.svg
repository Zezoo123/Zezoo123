<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Zeyad Awadalla - Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="55%" stop-color="#111d2b"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#dots)"/>
    <rect width="1000" height="220" fill="url(#glow)"/>
    <path d="M 832 62.0 A 48 48 0 0 1 832 158.0" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.30" stroke-linecap="round"><animate attributeName="opacity" values="0.30;0.06;0.30" dur="3s" begin="0.0s" repeatCount="indefinite"/></path>
    <path d="M 832 34.0 A 76 76 0 0 1 832 186.0" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.30" stroke-linecap="round"><animate attributeName="opacity" values="0.30;0.06;0.30" dur="3s" begin="0.4s" repeatCount="indefinite"/></path>
    <path d="M 832 6.0 A 104 104 0 0 1 832 214.0" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.30" stroke-linecap="round"><animate attributeName="opacity" values="0.30;0.06;0.30" dur="3s" begin="0.8s" repeatCount="indefinite"/></path>

    <text x="56" y="58" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#38bdf8" opacity="0.85" letter-spacing="1.5">~/Zezoo123</text>

    <text x="54" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e8edf3" letter-spacing="-0.5">Zeyad Awadalla</text>

    <rect x="56" y="142" width="0" height="2" rx="1" fill="url(#rule)">
      <animate attributeName="width" from="0" to="300" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0 1"/>
    </rect>

    <text x="56" y="178" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8b949e" letter-spacing="0.3">software engineer  <tspan fill="#4b5966">·</tspan>  fintech compliance  <tspan fill="#4b5966">·</tspan>  desktop tooling  <tspan fill="#4b5966">·</tspan>  applied ML <tspan fill="#38bdf8">▌<animate attributeName="fill-opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/></tspan></text>

    <rect width="1000" height="220" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>
</svg>
