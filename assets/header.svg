    <clipPath id="round"><rect width="1000" height="220" rx="14"/></clipPath>
    <clipPath id="type0"><rect x="56" y="162" height="22" width="0"><animate attributeName="width" dur="13.5s" repeatCount="indefinite" keyTimes="0;0.0;0.0963;0.2889;1" values="0;0;446;446;0"/></rect></clipPath>
    <clipPath id="type1"><rect x="56" y="162" height="22" width="0"><animate attributeName="width" dur="13.5s" repeatCount="indefinite" keyTimes="0;0.3333;0.4296;0.6222;1" values="0;0;429;429;0"/></rect></clipPath>
    <clipPath id="type2"><rect x="56" y="162" height="22" width="0"><animate attributeName="width" dur="13.5s" repeatCount="indefinite" keyTimes="0;0.6667;0.763;0.9556;1" values="0;0;286;286;0"/></rect></clipPath>
  </defs>

  <g clip-path="url(#round)">
