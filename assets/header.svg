<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Zeyad Awadalla - software engineer. Compliance infrastructure for emerging-market fintech, desktop tooling that runs in production, applied ML on messy financial data.">
  <defs>
